<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — BKPSDM Maluku Tengah</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{
  background: linear-gradient(135deg,#0d47a1 0%, #1565c0 40%, #42a5f5 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Segoe UI',sans-serif;
  position:relative;
  overflow:hidden;
}
body::before{
  content:'';
  position:absolute;
  width:600px;height:600px;
  background:rgba(255,255,255,0.08);
  border-radius:50%;
  top:-150px;left:-150px;
}
body::after{
  content:'';
  position:absolute;
  width:400px;height:400px;
  background:rgba(255,255,255,0.06);
  border-radius:50%;
  bottom:-100px;right:-100px;
}
.card{
  border:none;
  border-radius:20px;
  box-shadow:0 25px 50px rgba(0,0,0,.25);
  max-width:420px;
  width:100%;
  position:relative;
  z-index:1;
  backdrop-filter: blur(10px);
}
.logo-img{
  width:90px;
  height:90px;
  object-fit:contain;
  margin:0 auto 12px;
  display:block;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
}
.title-bkpsdm{
  font-weight:800;
  letter-spacing:0.5px;
  color:#0d47a1;
}
.subtitle{
  color:#6c757d;
}
.btn-primary{
  background: linear-gradient(135deg,#0d47a1,#1976d2);
  border:none;
  transition:0.2s;
}
.btn-primary:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(13,71,161,0.3);
}
.form-control:focus, .form-select:focus{
  border-color:#1565c0;
  box-shadow:0 0 0 0.2rem rgba(21,101,192,0.15);
}
</style>
</head>
<body>
<div class="card p-4">
<div class="text-center mb-4">
  <!-- LOGO ASLI TANPA LINGKARAN, SESUAI BENTUK -->
  <img src="logo-bkpsdm.png" alt="Logo BKPSDM" class="logo-img" onerror="this.style.display='none';document.getElementById('fallbackLogo').style.display='flex'">
  <div id="fallbackLogo" style="display:none;width:70px;height:70px;background:#0d47a1;color:#fff;border-radius:16px;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin:0 auto 12px">BK</div>
  <h5 class="fw-bold title-bkpsdm mb-1">BKPSDM MALUKU TENGAH</h5>
  <p class="subtitle small mb-0">Sistem E-Disposisi & Arsip Digital</p>
  <div class="mt-2"><span class="badge bg-primary bg-opacity-10 text-primary" style="font-size:10px"><i class="fas fa-shield-alt me-1"></i> </span></div>
</div>

<div class="mb-3"><label class="form-label fw-semibold"><i class="fas fa-user me-1 text-primary"></i> Username</label><input type="text" id="username" class="form-control" placeholder="admin / kepala / bidang"></div>
<div class="mb-3"><label class="form-label fw-semibold"><i class="fas fa-lock me-1 text-primary"></i> Password</label><input type="password" id="password" class="form-control" placeholder="****"></div>
<div class="mb-4"><label class="form-label fw-semibold"><i class="fas fa-user-tag me-1 text-primary"></i> Masuk Sebagai</label><select id="role" class="form-select"><option value="admin">Admin</option><option value="kepala">Kepala Badan</option><option value="bidang">Bidang / Sekretariat</option></select></div>
<button class="btn btn-primary w-100 py-2 fw-bold" onclick="login()"><i class="fas fa-sign-in-alt me-2"></i> Masuk ke Sistem</button>

<div class="mt-4 p-3 bg-light rounded small" style="border-left:4px solid #1565c0">
  <strong><i class="fas fa-info-circle me-1"></i> Akun Default:</strong><br>
  Admin → admin / admin123<br>
  Kepala → kepala / kepala123<br>
  Bidang → bidang / bidang123<br>
  <hr class="my-2">
  <small class="text-muted">Admin bisa tambah user baru di menu Pengaturan Admin</small>
</div>
<div class="text-center mt-3"><small class="text-white-50" style="font-size:11px">© 2026 BKPSDM Kab. Maluku Tengah — Masohi</small></div>
</div>

<script>
function getUsers(){ return JSON.parse(localStorage.getItem('daftarUser')||'null') || [
 {username:'admin', password:'admin123', role:'admin', nama:'Administrator'},
 {username:'kepala', password:'kepala123', role:'kepala', nama:'Sah Alim Latuconsina, S.STP.,M.Si'},
 {username:'bidang', password:'bidang123', role:'bidang', nama:'Sekretariat'}
]; }
function login(){
 const u=document.getElementById('username').value.trim();
 const p=document.getElementById('password').value.trim();
 const r=document.getElementById('role').value;
 if(!u||!p){ alert('Isi username & password'); return; }
 const users=getUsers();
 const found=users.find(x=> x.username===u && x.password===p && x.role===r);
 if(!found){ alert('Username / Password / Role salah!'); return; }
 localStorage.setItem('peranPengguna', found.role);
 localStorage.setItem('usernameLogin', found.username);
 localStorage.setItem('namaLogin', found.nama);
 localStorage.setItem('userLogin', JSON.stringify(found));
 localStorage.setItem('daftarUser', JSON.stringify(users));
 // untuk kompatibilitas dengan disposisi-bidang private
 if(found.username.includes('mutasi')) localStorage.setItem('usernameLogin','kabid_mutasi');
 if(found.username.includes('pengadaan')) localStorage.setItem('usernameLogin','kabid_pengadaan');
 if(found.username.includes('kinerja')) localStorage.setItem('usernameLogin','kabid_kinerja');
 if(found.username.includes('pengembangan')) localStorage.setItem('usernameLogin','kabid_pengembangan');
 if(found.username.includes('sekretaris') || found.username==='sekretaris') localStorage.setItem('usernameLogin','sekretaris');
 alert('Login berhasil sebagai '+found.nama);
 if(found.role==='bidang') location.href='disposisi-bidang.html';
 else location.href='dashboard.html';
}
document.addEventListener('DOMContentLoaded', ()=>{
 if(!localStorage.getItem('daftarUser')) localStorage.setItem('daftarUser', JSON.stringify(getUsers()));
 document.getElementById('password').addEventListener('keypress', e=>{ if(e.key==='Enter') login(); });
});
</script>
</body>
</html>
