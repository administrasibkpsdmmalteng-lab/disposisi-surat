<!DOCTYPE html>
<html lang="id">
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
<div class="sidebar">
<div class="sidebar-brand">
  <img src="logo-bkpsdm.png" alt="Logo BKPSDM" style="width:75px;height:75px;object-fit:contain;margin-bottom:8px;filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));">
  <h5>BKPSDM</h5><p>Kab. Maluku Tengah</p>
  <div class="mt-2"><span id="whoLogin" class="badge bg-white text-primary" style="font-size:10px"></span></div>
</div>
<ul class="sidebar-menu">
<li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
<li><a href="surat-masuk.html"><i class="fas fa-envelope"></i> Surat Masuk</a></li>
<li><a href="disposisi-kepala.html"><i class="fas fa-file-signature"></i> Disposisi Surat</a></li>
<li><a href="disposisi-bidang.html"><i class="fas fa-envelope-open-text"></i> Disposisi Masuk</a></li>
<li><a href="arsip.html" class="active"><i class="fas fa-archive"></i> Arsip Digital</a></li>
<li><a href="#" onclick="keluar()"><i class="fas fa-sign-out-alt"></i> Keluar</a></li>
</ul>
</div>
<div class="main-content">
<div class="d-flex justify-content-between align-items-center mb-4"><h4><i class="fas fa-archive me-2 text-primary"></i> Arsip Digital</h4><input type="text" id="cariArsip" class="form-control w-auto" placeholder="Cari arsip..." onkeyup="render()"></div>
<div class="card p-3"><div class="table-responsive"><table class="table table-hover align-middle"><thead class="table-light"><tr><th>No</th><th>No Surat</th><th>Perihal</th><th>Kepala BKPSDM</th><th>TTD</th><th>Tgl Arsip</th><th>Aksi</th></tr></thead><tbody id="tbodyArsip"></tbody></table></div></div>

<div class="modal fade" id="modalArsip" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header bg-success text-white"><h5 class="modal-title">Detail Arsip + TTD</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body" id="bodyArsip"></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button><button class="btn btn-primary" onclick="cetakArsip()"><i class="fas fa-print"></i> Cetak</button></div></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function keluar(){ if(confirm('Keluar?')){localStorage.removeItem('peranPengguna'); location.href='login.html';} }
function getArsip(){ return JSON.parse(localStorage.getItem('arsipDigital')||'[]'); }
function render(){
 let list=getArsip(); const k=document.getElementById('cariArsip').value.toLowerCase();
 if(k) list=list.filter(a=> (a.noSurat||a.nomorSurat||'' + a.perihal||'').toLowerCase().includes(k));
 const tbody=document.getElementById('tbodyArsip');
 if(list.length===0){ tbody.innerHTML='<tr><td colspan="7" class="text-center py-4 text-muted">Belum ada arsip</td></tr>'; return; }
 tbody.innerHTML=list.map((a,i)=>`
  <tr>
   <td>${i+1}</td><td>${a.noSurat||a.nomorSurat||'-'}</td><td>${(a.perihal||a.perihalSurat||'').substring(0,40)}</td>
   <td><small>${a.namaKepala||'Sah Alim Latuconsina, S.STP.,M.Si'}</small></td>
   <td>${a.ttd?`<img src="${a.ttd}" style="width:70px;height:30px;object-fit:contain">`:'-'}</td>
   <td>${a.diarsipkanPada?new Date(a.diarsipkanPada).toLocaleDateString('id-ID'):'-'}</td>
   <td><button class="btn btn-sm btn-primary" onclick="lihat(${i})"><i class="fas fa-eye"></i></button> <button class="btn btn-sm btn-danger" onclick="hapus(${i})"><i class="fas fa-trash"></i></button></td>
  </tr>`).join('');
 window._arsip=list;
}
function lihat(i){
 const a=window._arsip[i];
 document.getElementById('bodyArsip').innerHTML=`
  <div id="areaCetakArsip" style="border:2px solid #333;padding:15px;background:#fff">
   <div class="text-center border-bottom border-dark pb-2 mb-2"><strong>BKPSDM MALUKU TENGAH - ARSIP DISPOSISI</strong><br>No: ${a.noSurat||a.nomorSurat}</div>
   <p>Perihal: ${a.perihal||a.perihalSurat}<br>Dari: ${a.pengirimSurat||a.suratDari||'-'}<br>Catatan: ${a.catatan||a.arahan||'-'}</p>
   <div class="text-end mt-4"><p class="mb-0">Masohi, ${a.tglTTD||''} 2026<br>Kepala Badan,</p>
   ${a.ttd?`<img src="${a.ttd}" style="width:200px;height:80px;object-fit:contain">`:`<div style="height:80px"></div>`}
   <p class="mb-0"><u><strong>${a.namaKepala||'Sah Alim Latuconsina, S.STP.,M.Si'}</strong></u></p><p style="font-size:12px">${a.nipKepala||'NIP. 198005151999121001'}</p></div>
  </div>`;
 new bootstrap.Modal(document.getElementById('modalArsip')).show();
}
function cetakArsip(){ const area=document.getElementById('areaCetakArsip').innerHTML; const w=window.open(''); w.document.write('<html><body>'+area+'</body></html>'); w.document.close(); w.print(); }
function hapus(idx){ if(!confirm('Hapus arsip?')) return; let list=getArsip(); list.splice(idx,1); localStorage.setItem('arsipDigital',JSON.stringify(list)); render(); }
document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
